name: Release

# Publishing runs here rather than from a laptop so npm can attest provenance:
# the OIDC token GitHub mints below carries the repository, workflow path and
# ref, and npm checks those claims against the trusted publisher registered for
# the package. A local `pnpm publish` still works as a break-glass path, but it
# produces an unattested tarball.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: publish @mycl/core
    # This file also exists on the private remote. Without the guard, a tag
    # pushed there fires a publish whose OIDC claims can never match.
    if: github.repository == 'jgullstr/mycl'
    runs-on: ubuntu-latest
    # Trusted publishing is scoped to repository + workflow path, so anyone who
    # can push this file could otherwise publish. The protected environment is
    # what closes that.
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # check-tag-version needs main to test reachability against.
          fetch-depth: 0

      # Reads the pnpm version from the root package.json packageManager field.
      - uses: pnpm/action-setup@v4

      # Node 22 to match the CI job that gates main, so the release is verified
      # on the runtime the test suite actually runs on.
      #
      # Deliberately no `registry-url`: it makes setup-node write an .npmrc
      # holding `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and with
      # no NODE_AUTH_TOKEN (there is none by design here) that resolves to an
      # EMPTY token, which publishes unauthenticated.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Node 22 bundles npm 10.9.x, which predates trusted publishing entirely
      # and so never attempts the OIDC exchange: it publishes unauthenticated
      # (a masked 404 with an empty token configured, ENEEDAUTH without one).
      # npm gained OIDC in 11.5.1. Upgrading npm rather than moving the job to
      # Node 24 keeps the release on the same runtime CI gates main with.
      - run: npm install -g npm@11
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      # First, and before the build: a tag/version mismatch or a tag off main is
      # fatal and cheap to detect, and both are permanent once published.
      - run: node scripts/check-tag-version.mjs packages/core

      # The same gate main passes. The tagged commit is re-verified here rather
      # than trusted to have been green when it was merged.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm size
      - run: pnpm check-dce
      - run: pnpm check-changelog
      - run: pnpm coverage
      - run: pnpm smoke

      # npm directly rather than `pnpm publish`, which only shells out to npm for
      # the upload anyway: trusted publishing is npm's feature, and the extra
      # layer bought nothing here (@mycl/core has no dependencies, so there are
      # no workspace: ranges for pnpm to rewrite) while making two failures
      # harder to read.
      #
      # No NPM_TOKEN: `id-token: write` above is the whole authentication story.
      # Provenance is automatic under trusted publishing; the flag is explicit
      # so a misconfiguration fails loudly instead of publishing unattested.
      - run: npm publish --provenance --access public
        working-directory: packages/core
