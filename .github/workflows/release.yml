name: Release

# Publishing runs on GitHub so npm can attest provenance:
# the OIDC token GitHub mints below carries the repository, workflow path and
# ref, and npm checks those claims against the trusted publisher registered for
# the package.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: publish @mycl/core
    # Restricts publishing to the public repository, the one npm's trusted
    # publisher names in its claims.
    if: github.repository == 'jgullstr/mycl'
    runs-on: ubuntu-latest
    # Gates the publish behind the protected `release` environment, narrowing
    # trusted publishing from "anyone who can push this workflow file" to an
    # approved deployment.
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so check-tag-version can test the tag's reachability
          # from main.
          fetch-depth: 0

      # Reads the pnpm version from the root package.json packageManager field.
      - uses: pnpm/action-setup@v4

      # Node 22 matches the CI job that gates main, so the release runs the
      # suite on the runtime it was verified against. The registry stays at its
      # default: credentials come from the OIDC exchange below.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # npm performs the OIDC exchange from 11.5.1 onward; Node 22 bundles
      # 10.9.x. Installing npm 11 supplies the version that can authenticate,
      # and `npm --version` records which one ran in the release log.
      - run: npm install -g npm@11
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      # Confirms the tag names the version being published and sits on main.
      # Runs before the build so both fail in seconds, and both are permanent
      # once a version reaches the registry.
      - run: node scripts/check-tag-version.mjs packages/core

      # Re-runs the gate main passes, against the tagged commit itself.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm size
      - run: pnpm check-dce
      - run: pnpm check-changelog
      - run: pnpm coverage
      - run: pnpm smoke

      # Publishes through npm, which owns trusted publishing: it exchanges the
      # `id-token: write` identity above for a registry credential and attaches
      # the provenance attestation. `--provenance` states that requirement
      # explicitly, so a run that cannot attest fails instead of shipping
      # unattested. @mycl/core has no dependencies, so the manifest publishes
      # as it sits on disk.
      - run: npm publish --provenance --access public
        working-directory: packages/core

  # The Releases page is where watchers, the releases.atom feed and dependency
  # bots look; a bare tag reaches none of them. Notes are written only after the
  # tarball reaches the registry, so the page never advertises a version npm
  # does not have, and in a job of their own so `contents: write` never sits
  # beside the publishing identity above.
  notes:
    name: write the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # No install and no setup-node: the gate script is dependency-free and
      # reads two files, so the runner's own Node runs it.
      - run: node scripts/check-changelog.mjs packages/core --print > notes.md

      # --verify-tag refuses to invent a tag if the ref ever went missing.
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
