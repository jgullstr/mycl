name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # @mycl/core's declared engines floor: alsContext resolves node:async_hooks
  # via process.getBuiltinModule, backported to Node 20.16. The floor is a
  # claim about the PACKAGE, so this leg exercises core alone; the docs app
  # (Astro) needs Node 22.12+ and builds in the full job below. The packed
  # smoke test runs here too: it round-trips alsContext on the floor runtime.
  core-floor:
    name: core on Node 20.16 (engines floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the root package.json packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.16'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mycl/core build
      - run: pnpm --filter @mycl/core test
      - run: pnpm --filter @mycl/core typecheck
      - run: pnpm smoke

  full:
    name: full workspace on Node 22
    runs-on: ubuntu-latest
    # Codecov uploads with OIDC rather than a stored token, so the job needs to
    # mint an identity token. Nothing else here writes.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm size
      - run: pnpm check-dce
      - run: pnpm check-changelog
      # Re-runs the core suite under v8 instrumentation. The 100% thresholds in
      # packages/core/vitest.config.ts are the gate; this costs ~8s over the
      # plain `pnpm test` above, which buys keeping the engines-floor leg free
      # of a threshold it has no business enforcing.
      - run: pnpm coverage
      # Exercises the packed tarballs (npm pack + install), not the source the
      # test suite aliases to — guards the exports map and ESM-only artifacts.
      - run: pnpm smoke

      # Badge only: the thresholds above already failed the build if coverage
      # regressed, so a codecov.io outage must not redden a green run.
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: packages/core/coverage/lcov.info
          fail_ci_if_error: false
